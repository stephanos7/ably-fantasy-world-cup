services:
  postgres:
    image: postgres:16-alpine
    container_name: ably-fantasy-world-cup-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ably_fantasy_world_cup
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ably_fantasy_world_cup"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
